apiVersion: apps/v1
kind: Deployment
metadata: { name: flakefinder, labels: { app: flakefinder } }
spec:
  replicas: 1
  selector: { matchLabels: { app: flakefinder } }
  template:
    metadata: { labels: { app: flakefinder } }
    spec:
      containers:
        - name: flakefinder
          image: ghcr.io/cognis-digital/flakefinder:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: flakefinder }
spec:
  selector: { app: flakefinder }
  ports: [{ port: 80, targetPort: 8000 }]
